<!DOCTYPE html>
<!--
  Portfolio page, version 2 (skeleton).
  One file, no build step, no external requests (system fonts only, GDPR).

  How this file is organised:
    1. <style>  : design tokens and layout (v2 look)
    2. <body>   : empty frames for every section; JavaScript fills them
    3. <script> : DATA (edit this)  →  RENDERING (normally no changes needed)

  Content lives ONLY in the DATA part of the script.
  draft: true = kept in the source, not shown on the page.
  Note: the source is public, so drafts are readable by anyone who opens it.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velislav · Linux / DevOps portfolio</title>
<style>
  /* ============ Design tokens: every colour and font is defined once here ============ */
  :root{
    --bg: #0b0f12;          /* page background */
    --bg-alt: #0d1216;      /* every second section */
    --surface: #11171b;     /* cards and panels */
    --surface-2: #182128;   /* chips */
    --line: #22303a;        /* card borders */
    --line-soft: #1c272f;   /* section borders */
    --line-strong: #2c3b45; /* button borders */
    --ink: #e6edf0;         /* main text */
    --ink-2: #c3d0d6;       /* secondary text */
    --ink-3: #b7c4ca;       /* lead text */
    --muted: #93a4ad;       /* muted text */
    --muted-2: #7d8f99;     /* labels */
    --accent: #46e08a;      /* green: shipped, links, buttons */
    --cyan: #54c7d6;        /* entry kind (log / runbook / note) */
    --amber: #f2b84b;       /* in progress */
    --maxw: 1200px;
    /* IBM Plex is used if it is installed locally; nothing is downloaded */
    --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  }

  /* ============ Base ============ */
  *,*::before,*::after{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{ margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  h1,h2,h3,h4,p{ margin: 0; }
  ul{ margin: 0; padding: 0; list-style: none; }
  a{ color: var(--cyan); }
  a:hover{ color: #8fdde8; }
  *:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }
  .mono{ font-family: var(--font-mono); }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
  .skip-link{ position:absolute; left:-9999px; top:0; z-index:100; background: var(--accent); color: var(--bg); padding:10px 16px; }
  .skip-link:focus{ left:16px; top:16px; }
  [hidden]{ display: none !important; }
  @media (prefers-reduced-motion: reduce){ html{ scroll-behavior: auto; } .cursor{ animation: none !important; } }

  /* ============ Shared building blocks ============ */
  .wrap{ max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }
  .section{ border-top: 1px solid var(--line-soft); }
  .section.alt{ background: var(--bg-alt); }
  .section > .wrap{ padding-top: 80px; padding-bottom: 80px; display: flex; flex-direction: column; gap: 40px; }
  .section-head{ display: flex; flex-direction: column; gap: 12px; max-width: 720px; }
  .eyebrow{ font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; color: var(--accent); }
  .section h2{ font-size: 36px; line-height: 1.15; font-weight: 600; letter-spacing: -.01em; }
  .section-sub{ color: var(--ink-3); font-size: 17px; }
  .label{ font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; color: var(--muted-2); text-transform: uppercase; }
  .card{ background: var(--surface); border: 1px solid var(--line); }
  .chip{ font-family: var(--font-mono); font-size: 13px; padding: 5px 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 2px; color: var(--ink-2); }
  .chips{ display: flex; flex-wrap: wrap; gap: 8px; }
  .badge{ font-family: var(--font-mono); font-size: 12px; padding: 4px 10px; border-radius: 2px; white-space: nowrap; border: 1px solid currentColor; }
  .empty{ font-family: var(--font-mono); font-size: 13px; color: var(--muted-2); }
  .btn{ text-decoration: none; padding: 13px 20px; border-radius: 2px; font-size: 15px; border: 1px solid var(--line-strong); color: var(--ink); }
  .btn:hover{ color: var(--ink); border-color: var(--accent); }
  .btn-primary{ background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .btn-primary:hover{ color: var(--bg); }
  .btn-row{ display: flex; flex-wrap: wrap; gap: 12px; }
  @media (max-width: 720px){ .section > .wrap{ padding-top: 56px; padding-bottom: 56px; } .section h2{ font-size: 28px; } }

  /* ============ Header ============ */
  .site-header{ border-bottom: 1px solid var(--line-soft); }
  .header-inner{ max-width: var(--maxw); margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
  .brand{ display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--font-mono); font-weight: 600; font-size: 15px; }
  .brand:hover{ color: var(--ink); }
  .brand-dot{ width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .brand-host{ color: var(--muted-2); font-weight: 400; }
  .nav{ display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 14px; }
  .nav a{ color: var(--ink-2); text-decoration: none; padding: 10px 12px; }
  .nav a:hover{ color: var(--accent); }
  .nav a.nav-cta{ border: 1px solid var(--accent); color: var(--accent); padding: 10px 16px; border-radius: 2px; margin-left: 8px; }

  /* ============ Intro (hero + dashboard) ============ */
  .hero{ max-width: var(--maxw); margin: 0 auto; padding: 88px 24px 72px; display: flex; flex-wrap: wrap; gap: 56px; align-items: center; }
  .hero-text{ flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px; }
  .hero h1{ font-size: clamp(34px, 5vw, 56px); line-height: 1.08; font-weight: 600; letter-spacing: -.02em; }
  .hero h1 .soft{ color: var(--muted); }
  .hero-lead{ font-size: 19px; color: var(--ink-3); max-width: 620px; }
  .dash{ flex: 1 1 360px; min-width: 0; position: relative; padding: 24px; font-family: var(--font-mono); font-size: 14px; }
  .dash::before, .dash::after{ content: ""; position: absolute; width: 14px; height: 14px; }
  .dash::before{ top: -1px; left: -1px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  .dash::after{ bottom: -1px; right: -1px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }
  .dash-head{ display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px dashed var(--line); color: var(--muted); }
  .dash-state{ display: flex; align-items: center; gap: 8px; }
  .dot{ width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
  .dash-rows{ display: grid; grid-template-columns: 120px minmax(0, 1fr); row-gap: 10px; column-gap: 12px; margin: 0; }
  .dash-rows dt{ color: var(--muted-2); }
  .dash-rows dd{ margin: 0; }
  .cursor{ color: var(--accent); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity: 0; } }

  /* ============ 01 Stack ============ */
  .stack{ display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch; }
  .stack-list{ flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .stack-hint{ font-family: var(--font-mono); font-size: 12px; color: var(--muted-2); padding: 0 4px 4px; text-align: right; }
  .layer-btn{ display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; cursor: pointer; font: inherit; color: var(--ink); padding: 18px 20px; border-radius: 2px; border: 1px solid var(--line); background: var(--surface); }
  .layer-btn[aria-pressed="true"]{ border-color: var(--accent); background: #152027; }
  .layer-n{ font-family: var(--font-mono); font-size: 13px; color: var(--muted-2); width: 24px; }
  .layer-names{ display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; }
  .layer-name{ font-weight: 600; font-size: 17px; }
  .layer-role{ font-size: 13px; color: var(--muted); }
  .layer-panel{ flex: 999 1 480px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 28px; }
  .panel-head{ display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; }
  .panel-head h3{ font-size: 28px; font-weight: 600; }
  .panel-block{ display: flex; flex-direction: column; gap: 10px; }
  .change{ display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; }
  .change-box{ flex: 1 1 200px; min-width: 0; padding: 16px; border: 1px dashed var(--line-strong); border-radius: 2px; color: var(--ink-3); }
  .change-box.after{ border: 1px solid rgba(70,224,138,.4); background: rgba(70,224,138,.07); color: var(--ink); }
  .change-arrow{ display: flex; align-items: center; color: var(--accent); font-family: var(--font-mono); }
  .link-list{ display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .link-list a{ display: flex; align-items: center; gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
  .link-list a:hover{ color: var(--accent); }
  .kind{ font-family: var(--font-mono); font-size: 12px; width: 76px; flex-shrink: 0; color: var(--cyan); }

  /* ============ 02 Proof ============ */
  .proof-grid{ display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 24px; }
  .proof-card{ padding: 28px; display: flex; flex-direction: column; gap: 20px; }
  .proof-card h3{ font-size: 22px; font-weight: 600; }
  .card-meta{ font-family: var(--font-mono); font-size: 12px; color: var(--muted-2); }
  .trace-mini{ display: flex; flex-wrap: wrap; gap: 6px; }
  .step{ display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 2px; font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line-strong); color: var(--ink-2); }
  .step small{ font-size: 11px; color: var(--muted); }
  .step.cause{ border-color: var(--accent); background: rgba(70,224,138,.1); color: var(--accent); }
  .step.cause small{ color: var(--accent); }
  .step.skipped{ border-style: dashed; border-color: var(--line); color: var(--muted-2); }
  .step.skipped small{ color: var(--muted-2); }
  .case-dl{ margin: 0; display: grid; grid-template-columns: 96px minmax(0, 1fr); row-gap: 10px; column-gap: 16px; font-size: 15px; }
  .case-dl dt{ font-family: var(--font-mono); font-size: 12px; color: var(--muted-2); padding-top: 3px; }
  .case-dl dt.ok{ color: var(--accent); }
  .case-dl dd{ margin: 0; color: var(--ink-2); }
  .more{ font-family: var(--font-mono); font-size: 14px; text-decoration: none; color: var(--accent); }

  /* ============ 03 Working log ============ */
  .log-head{ display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; }
  .grid-wrap{ display: flex; flex-direction: column; gap: 8px; }
  .grid-cap{ display: flex; justify-content: space-between; gap: 12px; font-family: var(--font-mono); font-size: 11px; color: var(--muted-2); }
  .activity{ display: grid; grid-template-rows: repeat(7, 12px); grid-auto-flow: column; grid-auto-columns: 12px; gap: 4px; }
  .activity span{ width: 12px; height: 12px; border-radius: 2px; }
  .table-scroll{ overflow-x: auto; }
  .log-table{ width: 100%; min-width: 640px; border-collapse: collapse; font-size: 15px; }
  .log-table th{ text-align: left; font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--muted-2); padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .log-table td{ padding: 14px 20px; border-bottom: 1px solid var(--line-soft); }
  .log-table td.m{ font-family: var(--font-mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
  .log-table td.k{ font-family: var(--font-mono); font-size: 13px; color: var(--cyan); }
  .log-table a{ color: var(--ink); text-decoration: none; }
  .log-table a:hover{ color: var(--accent); }

  /* ============ 04 Runbooks ============ */
  .filter{ display: flex; flex-wrap: wrap; gap: 8px; }
  .filter button{ font: inherit; font-family: var(--font-mono); font-size: 13px; cursor: pointer; padding: 6px 12px; border-radius: 2px; border: 1px solid var(--line-strong); background: transparent; color: var(--ink-2); }
  .filter button[aria-pressed="true"]{ border-color: var(--accent); color: var(--accent); background: rgba(70,224,138,.07); }
  .rb-groups{ display: flex; flex-direction: column; gap: 28px; }
  .rb-group h3{ font-family: var(--font-mono); font-size: 13px; font-weight: 500; letter-spacing: .06em; color: var(--muted-2); text-transform: uppercase; margin-bottom: 10px; }
  .rb-item{ display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 18px 20px; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--line); }
  .rb-item:hover{ color: var(--accent); }
  .rb-item .rb-name{ flex: 1 1 320px; font-weight: 600; }
  .rb-item .card-meta{ white-space: nowrap; }
  .rb-steps{ display: flex; flex-direction: column; gap: 14px; counter-reset: none; }
  .rb-step{ padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
  .rb-step h4{ font-size: 17px; font-weight: 600; display: flex; gap: 12px; align-items: baseline; }
  .rb-step h4 .n{ font-family: var(--font-mono); font-size: 13px; color: var(--muted-2); }
  .rb-step p{ color: var(--ink-2); }
  .rb-step .term pre{ padding: 14px 16px; }
  .rb-kv{ margin: 0; display: grid; grid-template-columns: 96px minmax(0, 1fr); row-gap: 8px; column-gap: 14px; font-size: 15px; }
  .rb-kv dt{ font-family: var(--font-mono); font-size: 12px; color: var(--muted-2); padding-top: 3px; }
  .rb-kv dt.ok{ color: var(--accent); }
  .rb-kv dd{ margin: 0; color: var(--ink-2); }
  .rb-table{ width: 100%; min-width: 600px; border-collapse: collapse; font-size: 14px; }
  .rb-table th{ text-align: left; font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--muted-2); padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .rb-table td{ padding: 12px 16px; border-bottom: 1px solid var(--line-soft); color: var(--ink-2); vertical-align: top; }
  .warn{ border-left: 2px solid var(--amber); padding: 10px 14px; color: var(--ink-2); background: rgba(242,184,75,.06); }

  /* ============ 05 How I work ============ */
  .habits{ display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 24px; }
  .habit{ border-top: 2px solid var(--accent); padding-top: 20px; display: flex; flex-direction: column; gap: 10px; }
  .habit h3{ font-size: 20px; font-weight: 600; }
  .habit p{ color: var(--ink-3); }

  /* ============ 06 Contact ============ */
  .contact{ flex-direction: row !important; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 32px; }

  /* ============ Session detail view (#session/<id>) ============ */
  .detail{ max-width: var(--maxw); margin: 0 auto; padding: 64px 24px 96px; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start; }
  .detail-main{ flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 40px; }
  .detail-side{ flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
  .detail h1{ font-size: clamp(30px, 4.4vw, 46px); line-height: 1.1; font-weight: 600; letter-spacing: -.02em; }
  .tagline{ display: flex; flex-wrap: wrap; gap: 10px; }
  .tag{ font-family: var(--font-mono); font-size: 12px; padding: 4px 10px; border: 1px solid var(--line-strong); color: var(--muted); border-radius: 2px; }
  .tag.kind-tag{ color: var(--cyan); }
  .trace{ display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .trace .step{ padding: 14px; gap: 6px; font-size: 14px; }
  .trace .step .note{ font-family: var(--font-sans); font-size: 13px; color: var(--muted); line-height: 1.45; }
  .term{ background: #070a0c; border: 1px solid var(--line); border-radius: 2px; overflow-x: auto; }
  .term-bar{ padding: 10px 16px; border-bottom: 1px solid var(--line-soft); font-family: var(--font-mono); font-size: 12px; color: var(--muted-2); }
  .term pre{ margin: 0; padding: 20px; font-family: var(--font-mono); font-size: 14px; line-height: 1.7; color: var(--ink-2); white-space: pre; }
  .term .prompt{ color: var(--accent); }
  .case-cards{ display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; }
  .case-cards .card{ padding: 22px; display: flex; flex-direction: column; gap: 8px; color: var(--ink-2); }
  .case-cards .card.ok{ border-color: rgba(70,224,138,.4); color: var(--ink); }
  .case-cards .card.ok .card-meta{ color: var(--accent); }
  .field ul{ display: flex; flex-direction: column; gap: 8px; }
  .field li{ position: relative; padding-left: 16px; color: var(--ink-2); }
  .field li::before{ content: "·"; position: absolute; left: 0; color: var(--muted); }
  .side-card{ padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .layer-bar{ display: flex; gap: 4px; }
  .layer-bar span{ flex: 1; height: 4px; background: var(--line); }
  .layer-bar span.on{ background: var(--accent); }

  /* ============ Footer ============ */
  .site-footer{ border-top: 1px solid var(--line-soft); }
  .footer-inner{ max-width: var(--maxw); margin: 0 auto; padding: 28px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-family: var(--font-mono); font-size: 13px; color: var(--muted-2); }
  .footer-inner a{ color: var(--muted); }
</style>
</head>
<body>
<a class="skip-link" href="#log">Skip to the working log</a>

<!-- ============ HEADER: brand + navigation (static) ============ -->
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="#top"><span class="brand-dot"></span><span><span id="brand-name">velislav</span><span class="brand-host" id="brand-host"></span></span></a>
    <nav class="nav" aria-label="Main">
      <a href="#stack">stack</a>
      <a href="#proof">proof</a>
      <a href="#log">log</a>
      <a href="#runbooks">runbooks</a>
      <a href="#how">how I work</a>
      <a class="nav-cta" href="#contact">contact</a>
    </nav>
  </div>
</header>

<!-- ============ LANDING VIEW: intro + sections 01–05 ============ -->
<main id="landing">

  <!-- INTRO: eyebrow, title, intro text, links (left) + dashboard (right) -->
  <section class="hero" id="top">
    <div class="hero-text">
      <p class="eyebrow" id="hero-eyebrow"></p>
      <h1 id="hero-title"></h1>
      <p class="hero-lead" id="hero-lead"></p>
      <div class="btn-row" id="hero-links"></div>
    </div>
    <aside class="dash card" aria-label="Status">
      <div class="dash-head">
        <span id="dash-cmd"></span>
        <span class="dash-state" style="color: var(--accent)"><span class="dot"></span><span id="dash-state"></span></span>
      </div>
      <dl class="dash-rows" id="dash-rows"></dl>
    </aside>
  </section>

  <!-- 01 · THE STACK: layer list (left) + selected layer panel (right) -->
  <section class="section alt" id="stack">
    <div class="wrap">
      <div class="section-head">
        <p class="eyebrow">[ 01 · the stack ]</p>
        <h2 id="stack-title"></h2>
        <p class="section-sub" id="stack-sub"></p>
      </div>
      <div class="stack">
        <div class="stack-list">
          <div class="stack-hint">↑ up the stack</div>
          <div id="stack-list" style="display:flex; flex-direction:column; gap:8px"></div>
        </div>
        <div class="layer-panel card" id="layer-panel" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <!-- 02 · PROOF: one card per published session that has a `case` -->
  <section class="section" id="proof">
    <div class="wrap">
      <div class="section-head">
        <p class="eyebrow">[ 02 · proof ]</p>
        <h2 id="proof-title"></h2>
        <p class="section-sub" id="proof-sub"></p>
      </div>
      <div class="proof-grid" id="proof-grid"></div>
    </div>
  </section>

  <!-- 03 · WORKING LOG: activity grid (last 16 weeks) + table of published sessions -->
  <section class="section alt" id="log">
    <div class="wrap">
      <div class="log-head">
        <div class="section-head" style="max-width:620px">
          <p class="eyebrow">[ 03 · working log ]</p>
          <h2 id="log-title"></h2>
          <p class="section-sub" id="log-sub"></p>
        </div>
        <div class="grid-wrap">
          <div class="grid-cap"><span>last 16 weeks</span><span id="grid-count"></span></div>
          <div class="activity" id="activity" role="img"></div>
        </div>
      </div>
      <div class="table-scroll card">
        <table class="log-table">
          <thead><tr><th scope="col">date</th><th scope="col">type</th><th scope="col">layer</th><th scope="col">entry</th></tr></thead>
          <tbody id="log-rows"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- 04 · RUNBOOKS: library of published runbooks, grouped by main category, with a category filter -->
  <section class="section" id="runbooks">
    <div class="wrap">
      <div class="section-head">
        <p class="eyebrow">[ 04 · runbooks ]</p>
        <h2 id="rb-title"></h2>
        <p class="section-sub" id="rb-sub"></p>
      </div>
      <div class="filter" id="rb-filter" role="group" aria-label="Filter runbooks by category"></div>
      <div class="rb-groups" id="rb-groups"></div>

function monthLabel(ym){
  const [y, m] = ym.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString("en-GB", { month: "long", year: "numeric" });
}
function monthsSince(ym){
  const [y, m] = ym.split("-").map(Number), now = new Date();
  return Math.max(0, (now.getFullYear() - y) * 12 + (now.getMonth() + 1 - m));
}

// Typed status: "actively <word>_", one word after the other. Reduced motion: full sentence.
let typeTimer = null;
function startStatusTyping(){
  const el = $("status-typed");
  if (!el) return;
  clearTimeout(typeTimer);
  const prefix = TEXT.statusPrefix + " ", words = TEXT.statusWords;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent = prefix + words.join(", "); return; }
  let w = 0, n = 0, del = false;
  const tick = () => {
    n += del ? -1 : 1;
    el.textContent = prefix + words[w].slice(0, n);
    let delay = del ? 45 : 95;
    if (!del && n === words[w].length){ del = true; delay = 1700; }
    else if (del && n === 0){ del = false; w = (w + 1) % words.length; delay = 350; }
    typeTimer = setTimeout(tick, delay);
  };
  el.textContent = prefix;
  typeTimer = setTimeout(tick, 350);
}

      <div class="change"><div class="change-box"><div class="card-meta" style="margin-bottom:6px">before</div>${esc(l.before)}</div>
      <div class="change-arrow" aria-hidden="true">→</div>
      <div class="change-box after"><div class="card-meta" style="margin-bottom:6px; color: var(--accent)">after</div>${esc(l.after)}</div></div></div>` : ""}
    <div class="panel-block"><div class="label">proof</div>
      ${proof.length
        ? `<div class="link-list">${proof.map(s => `<a href="#session/${esc(s.id)}"><span class="kind">${esc(s.kind)}</span><span style="flex:1 1 auto">${esc(s.title)}</span><span aria-hidden="true" style="color: var(--muted-2)">→</span></a>`).join("")}</div>`
        : `<p class="empty">${esc(TEXT.emptyEntries)}</p>`}
    </div>`;
}

/* ---------- 02 Proof ---------- */
// Six bottom-up steps: before the cause = ok, the cause = cause, after = skipped
const traceSteps = found => STEPS.map((label, i) => ({ label, i, cls: i < found ? "" : i === found ? "cause" : "skipped", tag: i < found ? "ok" : i === found ? "cause" : "skipped" }));

function renderProof(){
  $("proof-title").textContent = TEXT.proofTitle;
  $("proof-sub").textContent = TEXT.proofSub;
  const cases = liveSessions().filter(s => s.case);
  $("proof-grid").innerHTML = cases.length ? cases.map(s => `
    <article class="card proof-card">
      <div class="card-meta">${esc([layerName(s.layer), s.date].filter(Boolean).join(" · "))}</div>
      <h3>${esc(s.title)}</h3>
      ${s.trace ? `<div class="trace-mini">${traceSteps(s.trace.found).map(t => `<span class="step ${t.cls}">${esc(t.label)}<small>${t.tag}</small></span>`).join("")}</div>` : ""}
      <dl class="case-dl">
        <dt>symptom</dt><dd>${esc(s.case.symptom)}</dd>
        <dt>cause</dt><dd>${esc(s.case.cause)}</dd>
        <dt>fix</dt><dd>${esc(s.case.fix)}</dd>
        <dt class="ok">verified</dt><dd style="color: var(--ink)">${esc(s.case.verified)}</dd>
      </dl>
      <a class="more" href="#session/${esc(s.id)}">Read the full entry →</a>
    </article>`).join("") : `<p class="empty">${esc(TEXT.emptyEntries)}</p>`;
}

/* ---------- 03 Working log ---------- */
function isoDate(d){ return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

function renderLog(){
  $("log-title").textContent = TEXT.logTitle;
  $("log-sub").textContent = TEXT.logSub;
  const list = liveSessions();

  // Activity grid: 16 weeks × 7 days (Mon–Sun), real dates of published sessions
  const perDay = {};
  list.forEach(s => { if (s.date) perDay[s.date] = (perDay[s.date] || 0) + 1; });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const start = new Date(today);
  start.setDate(today.getDate() - ((today.getDay() + 6) % 7) - 15 * 7);   // Monday, 15 weeks before this week
  const shades = ["#18222a", "rgba(70,224,138,.35)", "rgba(70,224,138,.6)", "rgba(70,224,138,.85)", "var(--accent)"];
  let cells = "", inRange = 0;
  for (let i = 0; i < 112; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const n = perDay[isoDate(d)] || 0;
    inRange += n;
    const bg = d > today ? "transparent" : shades[Math.min(n, 4)];
    cells += `<span style="background:${bg}" title="${isoDate(d)}: ${n}"></span>`;
  }
  $("activity").innerHTML = cells;
  $("activity").setAttribute("aria-label", `Activity grid: ${inRange} entries in the last 16 weeks`);
  $("grid-count").textContent = `${inRange} ${inRange === 1 ? "entry" : "entries"}`;

  // Table
  $("log-rows").innerHTML = list.length ? list.map(s => `
    <tr>
      <td class="m">${esc(s.date || "")}</td>
      <td class="k">${esc(s.kind)}</td>
      <td class="m">${s.layer ? "L" + esc(s.layer) : ""}</td>
      <td><a href="#session/${esc(s.id)}">${esc(s.title)}</a></td>
    </tr>`).join("") : `<tr><td colspan="4" class="empty">${esc(TEXT.emptyEntries)}</td></tr>`;
}

/* ---------- 04 Runbooks: grouped by main category, filter by any category ---------- */
let rbFilter = null;
function renderRunbooks(){
  $("rb-title").textContent = TEXT.rbTitle;
  $("rb-sub").textContent = TEXT.rbSub;
  const all = liveSessions().filter(s => s.kind === "runbook");
  const order = c => { const i = CATEGORIES.indexOf(c); return i < 0 ? 99 : i; };
  const cats = [...new Set(all.flatMap(r => r.categories || []))].sort((a, b) => order(a) - order(b));
  $("rb-filter").innerHTML = all.length ? [null, ...cats].map(c =>
    `<button type="button" data-cat="${esc(c || "")}" aria-pressed="${c === rbFilter}">${esc(c || TEXT.rbAll)}</button>`).join("") : "";
  $("rb-filter").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { rbFilter = b.dataset.cat || null; renderRunbooks(); }));
  const shown = all.filter(r => !rbFilter || (r.categories || []).includes(rbFilter));
  const groups = {};
  shown.forEach(r => { const main = (r.categories || ["other"])[0]; (groups[main] = groups[main] || []).push(r); });
  const keys = Object.keys(groups).sort((a, b) => order(a) - order(b));
  $("rb-groups").innerHTML = keys.length ? keys.map(k => `
    <div class="rb-group"><h3>${esc(k)}</h3><div class="card">${groups[k].map(r => `
      <a class="rb-item" href="#session/${esc(r.id)}">
        <span class="rb-name">${esc(r.title)}</span>
        <span class="card-meta">${esc([layerName(r.layer), r.tested ? "tested " + r.tested : ""].filter(Boolean).join(" · "))}</span>
        <span class="chips" style="width:100%">${(r.categories || []).map(c => `<span class="chip">${esc(c)}</span>`).join("")}</span>
      </a>`).join("")}</div></div>`).join("") : `<p class="empty">${esc(TEXT.emptyEntries)}</p>`;
}

/* ---------- 05 How I work ---------- */
function renderHow(){
  $("how-title").textContent = TEXT.howTitle;
  $("how-sub").textContent = TEXT.howSub;
  $("how-sub").hidden = !TEXT.howSub;
  $("habits").innerHTML = TEXT.habits.map((h, i) => `
    <div class="habit"><div class="card-meta" style="font-size:13px">${String(i + 1).padStart(2, "0")}</div><h3>${esc(h.title)}</h3><p>${esc(h.text)}</p></div>`).join("");
}

/* ---------- 06 Contact ---------- */
function renderContact(){
  $("contact-title").textContent = TEXT.contactTitle;

/* ---------- Footer ---------- */
function renderFooter(){
  $("footer-text").textContent = TEXT.footer;
  $("footer-link").innerHTML = CONFIG.links.source ? `<a href="${esc(CONFIG.links.source)}" target="_blank" rel="noopener">view source →</a>` : "";
}

/* ---------- Detail view: #session/<id> ---------- */
function list(label, items){
  return items && items.length ? `<div class="field panel-block"><div class="label">${esc(label)}</div><ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>` : "";
}
// Terminal block: lines that start with "$ " get a green prompt
function terminal(text, env){
  const lines = String(text).split("\n").map(line => line.startsWith("$ ") ? `<span class="prompt">$</span> ${esc(line.slice(2))}` : esc(line)).join("\n");
  return `<div class="panel-block"><div class="label">terminal</div><div class="term"><div class="term-bar">${esc(env || "shell")} · bash</div><pre>${lines}</pre></div></div>`;
}

// One runbook step (also used for verify): title, text, command block, explanation, man page, expected result, check
function rbStep(st, n){
  return `<div class="card rb-step">
    <h4><span class="n">${esc(n)}</span>${esc(st.title)}</h4>
    ${st.text ? `<p>${esc(st.text)}</p>` : ""}
    ${st.cmd ? `<div class="term"><pre><span class="prompt">$</span> ${esc(st.cmd)}</pre></div>` : ""}
    ${st.explain || st.man || st.expected || st.check ? `<dl class="rb-kv">
      ${st.explain ? `<dt>what</dt><dd>${esc(st.explain)}</dd>` : ""}
      ${st.man ? `<dt>man</dt><dd class="mono" style="font-size:13px">${esc(st.man)}</dd>` : ""}
      ${st.expected ? `<dt>expected</dt><dd>${esc(st.expected)}</dd>` : ""}
      ${st.check ? `<dt class="ok">✓ check</dt><dd style="color: var(--ink)">${esc(st.check)}</dd>` : ""}
    </dl>` : ""}
  </div>`;
}
function runbookBody(s){
  if (s.kind !== "runbook") return "";
  const block = (label, inner) => inner ? `<div class="panel-block"><div class="label">${esc(label)}</div>${inner}</div>` : "";
  return [
    block("prerequisites", (s.prereqs || []).length ? `<div class="field"><ul>${s.prereqs.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>` : ""),
    s.warning ? `<p class="warn">⚠ ${esc(s.warning)}</p>` : "",
    block("steps", (s.steps || []).length ? `<div class="rb-steps">${s.steps.map((st, i) => rbStep(st, String(i + 1).padStart(2, "0"))).join("")}</div>` : ""),
    block("verify", (s.verify || []).length ? `<div class="rb-steps">${s.verify.map((st, i) => rbStep(st, "V" + (i + 1))).join("")}</div>` : ""),
    block("troubleshooting", (s.troubleshooting || []).length ? `<div class="table-scroll card"><table class="rb-table"><thead><tr><th>symptom</th><th>check</th><th>fix</th></tr></thead><tbody>${s.troubleshooting.map(t => `<tr><td>${esc(t.symptom)}</td><td>${esc(t.check)}</td><td>${esc(t.fix)}</td></tr>`).join("")}</tbody></table></div>` : ""),
    block("rollback", s.rollback ? `<p style="color: var(--ink-2)">${esc(s.rollback)}</p>` : "")
  ].join("");
}

function renderDetail(id){
  const s = published(sessions).find(x => x.id === id);
  const isRb = !!(sessions.find(x => x.id === id && x.kind === "runbook"));
  const back = isRb ? `<a class="mono" href="#runbooks" style="color: var(--ink-2); text-decoration:none">← back to the runbooks</a>`
                    : `<a class="mono" href="#log" style="color: var(--ink-2); text-decoration:none">← back to the log</a>`;
  if (!s){
    $("detail").innerHTML = `<div class="detail"><div class="detail-main"><h1>Entry not found</h1>${back}</div></div>`;
    return;
  }
  const l = stack.find(x => x.n === s.layer);
  const trace = s.trace ? `<div class="panel-block"><div class="label">trace</div><div class="trace">${traceSteps(s.trace.found).map(t => `
      <div class="step ${t.cls}"><div style="display:flex; justify-content:space-between; font-size:12px"><span style="color: var(--muted-2)">0${t.i + 1}</span><span>${t.tag}</span></div>
      <div>${esc(t.label)}</div><div class="note">${esc((s.trace.notes || [])[t.i] || "")}</div></div>`).join("")}</div></div>` : "";
  const cards = s.case ? `<div class="case-cards">
      <div class="card"><div class="card-meta">root cause</div><p>${esc(s.case.cause)}</p></div>
      <div class="card"><div class="card-meta">fix</div><p>${esc(s.case.fix)}</p></div>
      <div class="card ok"><div class="card-meta">verified</div><p>${esc(s.case.verified)}</p></div>
    </div>` : "";
  const related = (s.related || []).map(r => published(sessions).find(x => x.id === r)).filter(Boolean);

  $("detail").innerHTML = `<div class="detail">
    <article class="detail-main">
      ${back}
      <div class="panel-block" style="gap:16px">
        <div class="tagline">
          ${s.date ? `<span class="tag">${esc(s.date)}</span>` : ""}
          ${l ? `<span class="tag">${esc(layerName(l.n))}</span>` : ""}
          <span class="tag kind-tag">${esc(s.kind)}</span>
          ${s.time ? `<span class="tag">${esc(s.time)}</span>` : ""}
          ${s.tested ? `<span class="tag" style="color: var(--accent)">tested ${esc(s.tested)}</span>` : ""}
          ${s.status === "progress" ? `<span class="tag" style="color: var(--amber); border-color: var(--amber)">in progress</span>` : ""}
        </div>
        <h1>${esc(s.title)}</h1>
        <p class="hero-lead">${esc(s.summary)}</p>
      </div>
      ${trace}
      ${runbookBody(s)}
      ${s.evidence ? terminal(s.evidence, s.env) : ""}
      ${cards}
      ${list("learned", s.learned)}${list("encountered", s.encountered)}${list("solved by", s.solved)}${list("result", s.result)}${list("next", s.next)}
      ${s.hash ? `<p class="mono" style="color: var(--muted)">commit ${esc(s.hash)}</p>` : ""}
    </article>
    <aside class="detail-side">
      ${l ? `<div class="card side-card"><div class="label">layer</div>
        <div style="display:flex; align-items:center; gap:12px"><span class="mono" style="color: var(--muted-2)">L${l.n}</span><span style="font-weight:600; font-size:18px">${esc(l.name)}</span>
        <span class="badge" style="margin-left:auto; color: ${STATE[l.state].color}">${STATE[l.state].label}</span></div>
        <div class="layer-bar" aria-hidden="true">${stack.map(x => `<span class="${x.n <= l.n ? "on" : ""}"></span>`).join("")}</div></div>` : ""}
      ${s.categories && s.categories.length ? `<div class="card side-card"><div class="label">categories</div><div class="chips">${s.categories.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div></div>` : ""}
      ${s.environment ? `<div class="card side-card"><div class="label">tested on</div><p style="color: var(--ink-2); font-size:14px">${esc(s.environment)}</p></div>` : ""}
      ${s.topics && s.topics.length ? `<div class="card side-card"><div class="label">topics</div><div class="chips">${s.topics.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div></div>` : ""}
      ${related.length ? `<div class="card side-card"><div class="label">related</div><div class="link-list">${related.map(r => `<a href="#session/${esc(r.id)}"><span style="flex:1 1 auto">${esc(r.title)}</span><span class="kind" style="width:auto">${esc(r.kind)}</span></a>`).join("")}</div></div>` : ""}
    </aside>
  </div>`;
}

/* ---------- Router: landing view or detail view, based on the URL hash ---------- */
function route(){
  const m = location.hash.match(/^#session\/(.+)$/);
  $("landing").hidden = !!m;
  $("detail").hidden = !m;
  if (m){
    renderDetail(decodeURIComponent(m[1]));
    window.scrollTo(0, 0);
    document.title = `${$("detail").querySelector("h1").textContent} · ${CONFIG.handle}`;
  } else {
    document.title = "Velislav · Linux / DevOps portfolio";
    const target = location.hash.length > 1 ? document.getElementById(decodeURIComponent(location.hash.slice(1))) : null;
    if (target) target.scrollIntoView();
  }
}

/* ---------- Start ---------- */
renderIntro();
renderDashboard();
renderStack();
renderProof();
renderLog();
renderRunbooks();
renderHow();
renderContact();
renderFooter();
window.addEventListener("hashchange", route);
route();
</script>
</body>
